<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <!-- Thème choisi (ou celui du système) posé avant le premier affichage : pas de flash clair -->
  <script>
    (function () {
      var choix = 'system'
      try { choix = localStorage.getItem('conance-vitrine-theme') || 'system' } catch (e) {}
      var sombre = choix === 'dark' || (choix !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (sombre) document.documentElement.classList.add('dark')
      document.documentElement.style.colorScheme = sombre ? 'dark' : 'light'
    })()
  </script>
  <!-- With JavaScript the app replaces the prerendered text at mount: keep it hidden until then.
       Without JavaScript (AI crawlers) the class is never set and the text stays readable. -->
  <script>document.documentElement.classList.add('js')</script>
  <style>html.js body > #app:not([data-v-app]) { visibility: hidden }</style>
  <!-- seo:start -->
  <title>Conance : logiciel de gestion des commissions pour CGP</title>
  <meta name="description" content="Conance, le back-office des commissions des cabinets de gestion de patrimoine : importez vos bordereaux, repérez ce qui manque, prévoyez ce qui va tomber." />
  <link rel="canonical" href="https://conance.io/" />
  <meta property="og:title" content="Conance : logiciel de gestion des commissions pour CGP" />
  <meta property="og:description" content="Conance, le back-office des commissions des cabinets de gestion de patrimoine : importez vos bordereaux, repérez ce qui manque, prévoyez ce qui va tomber." />
  <meta property="og:url" content="https://conance.io/" />
  <!-- seo:end -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Umami Analytics -->
  <script defer src="https://analytics.elouanb7.com/script.js"
    data-website-id="8a72159c-d03b-4956-be0e-e16e594c376a"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>

  <!-- Chatwoot Live Chat -->
  <script>
    // Only load Chatwoot in production (not on localhost)
    if (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
      // Le widget démarre dans le thème de la page (posé plus haut) ; theme.ts le suit ensuite
      window.chatwootSettings = {
        darkMode: document.documentElement.classList.contains('dark') ? 'dark' : 'light'
      };
      (function (d, t) {
        var BASE_URL = "https://chat.elouanb7.com";
        var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
        g.src = BASE_URL + "/packs/js/sdk.js";
        g.async = true;
        s.parentNode.insertBefore(g, s);
        g.onload = function () {
          window.chatwootSDK.run({
            websiteToken: 'SdcQEhKfknEBBUn4VuYHnqcm',
            baseUrl: BASE_URL
          })
        }
      })(document, "script");
    } else {
      console.log('Chatwoot disabled in development mode');
    }
  </script>
</body>

</html>
