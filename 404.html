<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Page introuvable | Conance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <script>
        // Public pages are real files without a trailing slash: an old link with one still lands
        if (location.pathname.length > 1 && location.pathname.endsWith('/')) {
            location.replace(location.pathname.slice(0, -1) + location.search + location.hash);
        }
    </script>
    <style>
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            background-color: #062924;
            color: #d4d1ca;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            font-size: 1.75rem;
            margin: 1.5rem 0 0.5rem;
        }
        a {
            color: #52d2a6;
        }
    </style>
</head>
<body>
    <main>
        <img src="/logo-conance-white.svg" alt="Conance" height="32">
        <h1>Cette page n'existe pas</h1>
        <p>Elle a peut-être changé d'adresse. <a href="/">Revenir à l'accueil</a></p>
    </main>
</body>
</html>
